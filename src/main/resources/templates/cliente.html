<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, ~{})}">
<head><title>Cliente · Mini ETL Studio</title></head>
<body>
<section th:with="c=${cliente}">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/clientes}">Clientes</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="|Cliente #${c.id}|">#1</li>
        </ol>
    </nav>
    <div class="card" style="max-width: 40rem">
        <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
                <span class="brand-logo" style="width:3rem;height:3rem"><i class="bi bi-person-fill fs-4"></i></span>
                <div>
                    <h1 class="h4 mb-0" th:text="${c.nome}">Nome</h1>
                    <div class="text-body-secondary small" th:text="|Cliente #${c.id}|">#1</div>
                </div>
            </div>
            <dl class="row mb-0">
                <dt class="col-sm-4">E-mail</dt><dd class="col-sm-8 text-break" th:text="${c.email}">email</dd>
                <dt class="col-sm-4">Telefone</dt><dd class="col-sm-8" th:text="${c.telefone}">tel</dd>
                <dt class="col-sm-4">Cidade</dt><dd class="col-sm-8" th:text="${c.cidade}">cidade</dd>
                <dt class="col-sm-4">Data de criação</dt>
                <dd class="col-sm-8 mb-0" th:text="${#temporals.format(c.dataCriacao, 'dd/MM/yyyy HH:mm:ss')}">data</dd>
            </dl>
        </div>
    </div>
</section>
</body>
</html>
